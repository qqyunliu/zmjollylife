server:
  port: 7069
  servlet:
    context-path: /admin
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  application:
    name: easylive-admin
  datasource:
    url: jdbc:mysql://localhost:3310/easylive?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    database: 0
    host: 127.0.0.1
    port: 6380
    timeout: 10000
    jedis:
      pool:
        max-active: 50
        max-wait: 10000
        max-idle: 20
        min-idle: 5
#mybatis 大小写转驼峰
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:com.easyjava/mappers/*.xml
  type-aliases-package: com.easyjava.entity  # 实体类所在包（与 mapper-locations 同级）

project:
  folder: c:/webser/easylive/
log:
  root:
    level: debug
admin:
  account: admin
  password: ${ADMIN_PASSWORD:}

aliyun:
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  region: ${ALIYUN_REGION:cn-shanghai}

volcengine:
  api-url: ${VOLCENGINE_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
  api-key: ${VOLCENGINE_API_KEY:}
  image-model-id: ${VOLCENGINE_IMAGE_MODEL:doubao-seed-2-0-mini-260215}
  audio-model-id: ${VOLCENGINE_AUDIO_MODEL:deepseek-v3-2-251201}